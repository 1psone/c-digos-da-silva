<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brechó do Lepes | Cadastro</title>
</head>
<body>
    <h1>BRECHÓ DO LEPES</h1>
    <h2>"~De comprinha em comprinha sua carteirinha vai ficando vazia."</h2>
    <form>
        <label for="produto">Produto: </label>
        <input type="text" name="produto" id="produto" required placeholder="Nome do Produto aqui.">
        <br>
        <label for="descricao">Descrição: </label>
        <input type="text" name="descricao" id="descricao" required placeholder="Descrição aqui.">
        <br>
        <label for="cor">Cor: </label>
        <input type="color" name="cor" id="cor" required placeholder="Selecione uma cor.">
        <br>
        <label for="marca">Marca: </label>
        <input type="text" name="marca" id="marca" required placeholder="Nome da marca aqui.">
        <br>
        <label for="tamanho">Tamanho: </label>
        <input type="text" name="tamanho" id="tamanho" required placeholder="Tamanho aqui.">
        <br>
        <label for="quantidade">Quantidade: </label>
        <input type="number" name="quantidade" id="quantidade" required placeholder="Quantidade aqui. (Apenas Números)">
        <br>
        <label for="precoinvestido">Valor investido: </label>
        <input type="number" name="precoinvestido" id="precoinvestido" required placeholder="Valor investido aqui.">
        <br>
        <label for="precovenda">Valor do produto: </label>
        <input type="number" name="precovenda" id="precovenda" required placeholder="Valor do produto aqui.">
        <br>
        <label for="observacoes">Observações: </label>
        <input type="text" name="observacoes" id="observacoes" required placeholder="Observações aqui.">
        <br>
        <label for="foto">Foto do Produto: </label>
        <input type="file" name="foto" id="foto" required placeholder="Selecione uma imagem.">
    </form>
</body>
</html>
