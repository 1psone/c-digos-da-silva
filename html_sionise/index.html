<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>brechó do lepes</title>
    </head>
    <body>
        <h1>BRECHÓ DO LEPES</h1>
        <h2>"~De comprinha em comprinha sua carteirinha vai ficando vazia."</h2>
        <p>Formulário de Cadastro para Membros: </p>
        <form>
            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome" required placeholder="Nome completo aqui.">
            <br>
            <label for="cpf">CPF: </label>
            <input type="number" name="cpf" id="cpf" required placeholder="CPF aqui, apenas números. Ex: 12345678910">
            <br>
            <label for="email">Email: </label>
            <input type="email" name="email" id="email" required placeholder="Email aqui.">
            <br>
            <label for="telefone">Telefone: </label>
            <input type="tel" name="telefone" id="telefone" required placeholder="(xx)xxxx-xxxx">
            <br>
            <label for="senha">Senha: </label>
            <input type="password" name="senha" id="senha" required placeholder="Senha aqui.">
        </form>
    </body>
</html>
